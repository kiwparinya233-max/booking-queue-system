<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>เข้าสู่ระบบ - ระบบจองคิวบุคลากร คณะครุศาสตร์อุตสาหกรรม</title>

<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

<!-- Custom CSS -->
<link rel="stylesheet" href="./css/style.css" />
</head>
<body class="bg-gradient-to-br from-slate-100 via-slate-50 to-pink-50/30 min-h-screen flex items-center justify-center p-4 sm:p-6 lg:p-8 font-sans">

<!-- กล่องแจ้งเตือน Toast -->
<div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>

<!-- Main Card Container -->
<div class="bg-white w-full max-w-4xl rounded-3xl shadow-2xl shadow-slate-200/80 overflow-hidden grid grid-cols-1 md:grid-cols-12 border border-slate-100/80 transition-all duration-300">

  <!-- ฝั่งซ้าย: แบนเนอร์โลโก้และข้อมูลคณะ -->
  <div class="md:col-span-5 bg-gradient-to-b from-white via-slate-50/50 to-pink-50/20 p-6 sm:p-8 flex flex-col justify-between relative overflow-hidden md:border-r border-slate-100">
    
    <!-- ลวดลายแสงตกแต่งพื้นหลัง -->
    <div class="absolute -top-12 -left-12 w-40 h-40 bg-pink-500/5 rounded-full blur-2xl pointer-events-none"></div>
    <div class="absolute -bottom-12 -right-12 w-40 h-40 bg-rose-500/5 rounded-full blur-2xl pointer-events-none"></div>

    <div class="relative z-10 space-y-6">
      <!-- โลโก้คณะ -->
      <div class="flex items-center justify-start">
        <img src="./images/logo-teed.png" alt="Logo TEED" class="h-16 sm:h-20 w-auto object-contain drop-shadow-sm transition-transform hover:scale-105" />
      </div>

      <!-- ข้อความรายละเอียดคณะ -->
      <div class="space-y-3">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-pink-100/80 text-pink-800 text-[11px] font-bold tracking-wider uppercase border border-pink-200/50">
          <i class="fa-solid fa-graduation-cap text-xs"></i>
          FACULTY OF TECHNICAL EDUCATION
        </span>
        
        <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-slate-900 leading-tight">
          ระบบจองคิวบุคลากร
        </h1>
        
        <p class="text-slate-600 text-xs sm:text-sm leading-relaxed font-normal">
          คณะครุศาสตร์อุตสาหกรรม มทร.ธัญบุรี<br/>
          <span class="text-slate-500 font-light mt-1 block">
            บริการขอใช้บุคลากรด้านต่างๆ เช่น งานประชาสัมพันธ์ ช่างภาพ งานเครื่องเสียง และโสตทัศนูปกรณ์
          </span>
        </p>
      </div>
    </div>

    <!-- ส่วนท้ายแบนเนอร์ -->
    <div class="relative z-10 pt-6 mt-6 text-[11px] text-slate-400 font-medium border-t border-slate-100 flex items-center justify-between">
      <span>RMUTT Booking System</span>
    </div>
  </div>

  <!-- ฝั่งขวา: ฟอร์ม Login / Register -->
  <div class="md:col-span-7 p-6 sm:p-8 lg:p-10 flex flex-col justify-center bg-white">

    <!-- ปุ่มสลับโหมด แท็บ Login / Register -->
    <div class="flex bg-slate-100/80 p-1.5 rounded-2xl mb-6 sm:mb-8 border border-slate-200/60 shadow-inner">
      <button
        id="tabLoginBtn"
        type="button"
        class="flex-1 py-2.5 px-3 text-xs sm:text-sm font-bold rounded-xl transition-all duration-200 bg-white text-pink-700 shadow-sm flex items-center justify-center gap-2"
      >
        <i class="fa-solid fa-right-to-bracket text-sm"></i>
        <span>เข้าสู่ระบบ</span>
      </button>
      <button
        id="tabRegisterBtn"
        type="button"
        class="flex-1 py-2.5 px-3 text-xs sm:text-sm font-semibold rounded-xl transition-all duration-200 text-slate-500 hover:text-slate-800 flex items-center justify-center gap-2"
      >
        <i class="fa-solid fa-user-plus text-sm"></i>
        <span>สมัครสมาชิก (ผู้ใช้งาน)</span>
      </button>
    </div>

    <!-- ฟอร์ม Login -->
    <form id="loginForm" class="space-y-5">
      <div>
        <label class="block text-xs sm:text-sm font-semibold text-slate-700 mb-1.5">ชื่อผู้ใช้ (Username)</label>
        <div class="relative group">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 group-focus-within:text-pink-600 transition-colors">
            <i class="fa-regular fa-user text-sm"></i>
          </div>
          <input 
            type="text" 
            id="loginUsername" 
            required 
            placeholder="กรอกชื่อผู้ใช้ของคุณ" 
            class="w-full pl-10 pr-4 py-3 bg-slate-50/50 border border-slate-200 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:bg-white focus:border-pink-600 focus:ring-4 focus:ring-pink-500/10 focus:outline-none transition-all duration-200" 
          />
        </div>
      </div>

      <div>
        <label class="block text-xs sm:text-sm font-semibold text-slate-700 mb-1.5">รหัสผ่าน (Password)</label>
        <div class="relative group">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 group-focus-within:text-pink-600 transition-colors">
            <i class="fa-solid fa-lock text-sm"></i>
          </div>
          <input 
            type="password" 
            id="loginPassword" 
            required 
            placeholder="••••••••" 
            class="w-full pl-10 pr-11 py-3 bg-slate-50/50 border border-slate-200 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:bg-white focus:border-pink-600 focus:ring-4 focus:ring-pink-500/10 focus:outline-none transition-all duration-200 [&::-ms-reveal]:hidden [&::-ms-clear]:hidden" 
          />
          <button 
            type="button" 
            onclick="togglePassword('loginPassword', 'loginEyeIcon')" 
            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none transition-colors"
            title="แสดง/ซ่อนรหัสผ่าน"
          >
            <i id="loginEyeIcon" class="fa-solid fa-eye-slash text-sm"></i>
          </button>
        </div>
      </div>

      <button 
        type="submit" 
        id="loginSubmitBtn" 
        class="w-full py-3.5 px-4 bg-gradient-to-r from-pink-700 to-rose-700 hover:from-pink-800 hover:to-rose-800 text-white font-bold rounded-xl shadow-lg shadow-pink-700/25 hover:shadow-xl hover:shadow-pink-700/35 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 flex items-center justify-center gap-2 text-sm mt-2"
      >
        <span>เข้าสู่ระบบ</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </button>
    </form>

    <!-- ฟอร์มสมัครสมาชิก (Register Form) -->
    <form id="registerForm" class="space-y-4 hidden">
      <!-- 1. ช่องกรอก ชื่อ-นามสกุล (regFullName) -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1.5">ชื่อ - นามสกุล *</label>
        <input
          type="text"
          id="regFullName"
          required
          placeholder="เช่น นายสมชาย ใจดี"
          class="w-full px-3.5 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:bg-white focus:border-pink-600 focus:ring-4 focus:ring-pink-500/10 focus:outline-none transition-all duration-200"
        />
      </div>

      <!-- 2. ช่องกรอก เบอร์โทรศัพท์ และ สังกัด/คณะ -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">เบอร์โทรศัพท์ *</label>
          <input
            type="tel"
            id="regPhone"
            required
            maxlength="10"
            placeholder="เช่น 0812345678"
            class="w-full px-3.5 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:bg-white focus:border-pink-600 focus:ring-4 focus:ring-pink-500/10 focus:outline-none transition-all duration-200"
          />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">สังกัด / คณะ / หน่วยงาน *</label>
          <select
            id="regDepartment"
            required
            class="w-full px-3.5 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:bg-white focus:border-pink-600 focus:ring-4 focus:ring-pink-500/10 focus:outline-none transition-all duration-200"
          >
            <option value="">-- เลือกสาขาวิชา / หน่วยงาน --</option>
            <option value="สาขาวิชาวิศวกรรมเครื่องกล">สาขาวิชาวิศวกรรมเครื่องกล</option>
            <option value="สาขาวิชาวิศวกรรมโยธา">สาขาวิชาวิศวกรรมโยธา</option>
            <option value="สาขาวิชาวิศวกรรมไฟฟ้า">สาขาวิชาวิศวกรรมไฟฟ้า</option>
            <option value="สาขาวิชาวิศวกรรมคอมพิวเตอร์">สาขาวิชาวิศวกรรมคอมพิวเตอร์</option>
            <option value="สาขาวิชาเทคโนโลยีสารสนเทศ">สาขาวิชาเทคโนโลยีสารสนเทศ</option>
            <option value="สำนักงานคณบดี คณะครุศาสตร์อุตสาหกรรม">สำนักงานคณบดี คณะครุศาสตร์อุตสาหกรรม</option>
            <option value="สโมสรนักศึกษาคณะครุศาสตร์อุตสาหกรรม">สโมสรนักศึกษาคณะครุศาสตร์อุตสาหกรรม</option>
            <option value="อื่นๆ">หน่วยงานอื่นๆ</option>
          </select>
        </div>
      </div>

      <!-- 3. ช่องกรอก Username และ Password -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Username *</label>
          <input
            type="text"
            id="regUsername"
            required
            placeholder="ชื่อสำหรับล็อกอิน"
            class="w-full px-3.5 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:bg-white focus:border-pink-600 focus:ring-4 focus:ring-pink-500/10 focus:outline-none transition-all duration-200"
          />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Password *</label>
          <div class="relative">
            <input
              type="password"
              id="regPassword"
              required
              placeholder="อย่างน้อย 4 ตัวอักษร"
              class="w-full pl-3.5 pr-11 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:bg-white focus:border-pink-600 focus:ring-4 focus:ring-pink-500/10 focus:outline-none transition-all duration-200 [&::-ms-reveal]:hidden [&::-ms-clear]:hidden"
            />
            <button
              type="button"
              onclick="togglePassword('regPassword', 'regEyeIcon')"
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none transition-colors"
              title="แสดง/ซ่อนรหัสผ่าน"
            >
              <i id="regEyeIcon" class="fa-solid fa-eye-slash text-sm"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- 4. ช่องกรอก ยืนยันรหัสผ่าน (regConfirmPassword) -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1.5">ยืนยันรหัสผ่าน *</label>
        <div class="relative">
          <input
            type="password"
            id="regConfirmPassword"
            required
            placeholder="กรอกรหัสผ่านอีกครั้ง"
            class="w-full pl-3.5 pr-11 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:bg-white focus:border-pink-600 focus:ring-4 focus:ring-pink-500/10 focus:outline-none transition-all duration-200 [&::-ms-reveal]:hidden [&::-ms-clear]:hidden"
          />
          <button
            type="button"
            onclick="togglePassword('regConfirmPassword', 'regConfirmEyeIcon')"
            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none transition-colors"
            title="แสดง/ซ่อนรหัสผ่าน"
          >
            <i id="regConfirmEyeIcon" class="fa-solid fa-eye-slash text-sm"></i>
          </button>
        </div>
      </div>

      <!-- ปุ่มกดสมัครสมาชิก -->
      <button
        type="submit"
        id="registerSubmitBtn"
        class="w-full py-3 bg-pink-600 hover:bg-pink-700 text-white font-semibold rounded-xl shadow-lg shadow-pink-600/20 transition-all duration-200 flex items-center justify-center gap-2 text-sm mt-2"
      >
        <i class="fa-solid fa-check-circle"></i>
        <span>สมัครสมาชิกผู้ใช้งาน</span>
      </button>

  </div>
</div>

<script type="module" src="./js/pages/login-page.js"></script>
</body>
</html>
